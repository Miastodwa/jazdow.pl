[build]
	command = "yarn build"
	publish = "www/.vuepress/dist"

# wersja Node-a jest tez w .nvmrc; tu trzymamy ja jawnie, zeby build byl przewidywalny
[build.environment]
	NODE_VERSION = "20"

[[redirects]]
	from = "/wesparcie"
	to = "/wesprzyj"
	status = 301

[[redirects]]
	from = "/pl/pomoc"
	to = "/wesprzyj"
	status = 301

# sprawozdania 2024 i 2025 rozbite na osobne pliki - stare adresy PDF-ow
[[redirects]]
	from = "/sprawozdania/2024_finansowe.pdf"
	to = "/sprawozdania"
	status = 301

[[redirects]]
	from = "/sprawozdania/2024_dodatkowe.pdf"
	to = "/sprawozdania"
	status = 301

[[redirects]]
	from = "/sprawozdania/2025_finansowe.pdf"
	to = "/sprawozdania"
	status = 301

[[redirects]]
	from = "/sprawozdania/2025_dodatkowe.pdf"
	to = "/sprawozdania"
	status = 301
